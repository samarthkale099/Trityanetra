version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  ast-engine:
    build:
      context: ./ast-engine
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      - AST_ENGINE_INTERNAL_SECRET=${AST_ENGINE_INTERNAL_SECRET:-dev-secret}
      - AST_ENGINE_HOST=0.0.0.0
      - AST_ENGINE_PORT=8000
    depends_on:
      redis:
        condition: service_healthy
